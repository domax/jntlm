plugins {
  id 'java'
  id 'application'
  id 'jacoco'
  id 'idea'
  id 'com.diffplug.spotless' version "7.0.3"
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springframework.boot' version '4.0.6'
}

repositories {
  mavenCentral()
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

idea {
  module {
    downloadSources = true
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

group = 'net.domax'

// Single source of truth for the application version: jntlm.version in
// src/main/resources/application.yml. It drives the JAR file name and manifest.
def appConfigFile = file('src/main/resources/application.yml')
def appVersionMatcher = (appConfigFile.text =~ /(?m)^\s{2}version:\s*["']?([^"'\s#]+)/)
if (!appVersionMatcher) {
  throw new GradleException("Could not find 'jntlm.version' in ${appConfigFile}")
}
//noinspection GroovyAssignabilityCheck
version = appVersionMatcher[0][1]

dependencies {
  implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.6')
  annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.0.6')
  testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.0.6')

  implementation 'org.springframework.boot:spring-boot-starter'
  annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
}

bootJar {
  exclude 'application-local.yml'
  manifest {
    attributes(
      'Implementation-Title': project.name,
      'Implementation-Version': project.version
    )
  }
}

test {
  useJUnitPlatform()
  jvmArgs "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}", '-Xshare:off'
  finalizedBy jacocoTestReport
}

jacocoTestReport {
  dependsOn test
  reports {
    xml.required = false
    csv.required = false
  }
}

jacoco {
  toolVersion = "0.8.13"
}

spotless {
  java {
    removeUnusedImports('cleanthat-javaparser-unnecessaryimport')
    // apply a specific flavor of google-java-format
    googleJavaFormat('1.27.0').reflowLongStrings(true).reorderImports(true)
    // fix formatting of type annotations
    formatAnnotations()
    // make sure every file has the following copyright header.
    licenseHeader '/* JNTLM © Licensed under MIT $YEAR. */'
  }
}

// IntelliJ Gradle sync expects this task to exist; register it only if absent.
if (!tasks.names.contains('prepareKotlinBuildScriptModel')) {
  tasks.register('prepareKotlinBuildScriptModel') {}
}
