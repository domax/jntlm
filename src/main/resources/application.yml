# jntlm - Java Spring Boot rewrite of the CNTLM proxy.
#
# jntlm is a local HTTP proxy that authenticates on your behalf (via NTLM) to a
# corporate parent proxy, so tools that cannot do NTLM themselves can reach the
# internet through the local, unauthenticated port below.

spring:
  pid:
    file: ./jntlm.pid
    fail-on-write-error: true
  profiles.include: custom

jntlm:
  version: "1.1.0"

  # Local listener. Bind to 127.0.0.1 so only this machine can use the proxy.
  listen-address: 127.0.0.1
  listen-port: 3128

  # NTLM dialect used when authenticating to the parent proxy. One of:
  #   NTLMV2  - NTLMv2 only (most secure, recommended default)
  #   NTLM2SR - NTLM2 Session Response
  #   NT      - NT response only
  #   NTLM    - NT + LM responses
  #   LM      - LM response only (least secure, legacy)
  auth: NTLMV2

  # Optional manual NTLM negotiate flags (hex or decimal). Leave 0 to let the
  # selected 'auth' dialect pick CNTLM-compatible defaults. With auto-detection
  # enabled (below), a non-zero value is simply the first candidate tried.
  # See https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-nlmp/99d90ff4-957f-4c8a-80e4-5bfe5a9a9832
  # for details on the NTLM negotiate flags.
  flags: 0

  # NTLM negotiate-flags auto-detection. jntlm probes the parent proxy with a
  # short list of candidate flags, caches the first set that completes the full
  # NTLM handshake, and logs it at INFO (so it can be pinned in 'flags').
  # Falls back to 'flags' / the dialect default when nothing works.
  detect:
    # Set to false if you want to disable probing (pre-detection behavior).
    enabled: true
    # Optional URL to probe at startup (http:// -> GET, https:// -> CONNECT).
    # Leave unset to detect lazily on the first client request.
    probe-url: ~

  # Ordered list of parent proxies, "host:port". Tried top-to-bottom with
  # round-robin failover if one becomes unreachable.
  parents:
    - proxy.example.com:8080
    # - proxy-backup.example.com:8080

  credentials:
    username: ${USERNAME}
    domain: ""
    # Workstation name sent in the NTLM handshake. Defaults to this host's
    # short name when left blank.
    workstation: ""

    # Provide EITHER the plaintext password (hashes are derived at startup)...
    password: "${PASSWORD}"

    # ...OR pre-computed password hashes (hex), in which case leave 'password'
    # blank. Generate these offline so the plaintext never sits in config.
    pass-lm: ""
    pass-nt: ""
    pass-ntlm2: ""

logging.level:
  net.domax.jntlm: INFO
